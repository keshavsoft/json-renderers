<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataList Autocomplete - json-renderers-specs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <i class="bi bi-box-seam text-warning me-2"></i>json-renderers-specs <span class="badge bg-primary">v2</span>
      </a>
      <span class="navbar-text text-light">DataList Demo</span>
    </div>
  </nav>

  <main class="container py-2" style="max-width: 600px;">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h4 mb-1 fw-bold text-dark">DataList Autocomplete</h1>
            <p class="text-muted small mb-0">Compiled from <code>samples/common/data.json</code> and <code>columns.json</code>. Only <code>type: "dataList"</code> defined.</p>
          </div>
          <a href="../index.html" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>All Samples
          </a>
        </div>
        
        <div class="mt-4">
          <label for="itemInput" class="form-label fw-semibold text-secondary small">Search Item (Try typing '0.09' or 'Wire'):</label>
          <input id="itemInput" list="itemName" class="form-control mb-2" placeholder="Start typing item name...">
          <div id="dom-render-container">
            <div class="text-center py-2 text-muted">Building datalist...</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>
